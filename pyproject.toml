[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnmap"
version = "1.0.0"
description = "Map where your AI coding agent session actually burns tokens and money - loops, cache misses and context creep, priced per turn."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mehulpatel23b-pixel" }]
keywords = ["ai-agents", "llm", "cost", "tokens", "observability", "cli", "claude-code", "codex"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
burnmap = "burnmap.cli:main"

[project.urls]
Homepage = "https://github.com/mehulpatel23b-pixel/burnmap"

[tool.setuptools.packages.find]
where = ["src"]
